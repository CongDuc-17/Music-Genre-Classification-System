<aside class="gl-sidebar"
       :class="sidebarOpen ? 'is-open' : ''"
       aria-label="Primary navigation">
  <div class="flex h-20 items-center gap-3 px-6">
    <span class="gl-brand-mark">G</span>
    <div>
      <p class="text-base font-bold">Genre</p>
      <p class="text-xs text-spotify-muted">Music classification</p>
    </div>
  </div>

  <nav class="mt-4 space-y-1 pr-4">
    <a href="{% url 'dashboard:home' %}" class="sidebar-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V10.5Z"/></svg>
      Home
    </a>
    <a href="{% url 'dashboard:upload' %}" class="sidebar-link {% if request.resolver_match.url_name == 'upload' or request.resolver_match.url_name == 'upload_result' %}active{% endif %}">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 16V4m0 0 4 4m-4-4-4 4M4 16v4h16v-4"/></svg>
      Upload
    </a>
    <a href="{% url 'dashboard:history' %}" class="sidebar-link {% if request.resolver_match.url_name == 'history' %}active{% endif %}">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5h14M5 12h14M5 19h14"/></svg>
      History
    </a>
    <a href="{% url 'dashboard:analytics' %}" class="sidebar-link {% if request.resolver_match.url_name == 'analytics' %}active{% endif %}">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 19V9m7 10V5m7 14v-7"/></svg>
      Analytics
    </a>
    <a href="{% url 'dashboard:settings' %}" class="sidebar-link {% if request.resolver_match.url_name == 'settings' %}active{% endif %}">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm7.4-2.1a8.2 8.2 0 0 0 0-2.8l2-1.5-2-3.4-2.4 1a8.4 8.4 0 0 0-2.4-1.4L14.2 3h-4.4l-.4 2.3A8.4 8.4 0 0 0 7 6.7l-2.4-1-2 3.4 2 1.5a8.2 8.2 0 0 0 0 2.8l-2 1.5 2 3.4 2.4-1a8.4 8.4 0 0 0 2.4 1.4l.4 2.3h4.4l.4-2.3a8.4 8.4 0 0 0 2.4-1.4l2.4 1 2-3.4-2-1.5Z"/></svg>
      Settings
    </a>
  </nav>

  <div class="absolute bottom-0 left-0 right-0 p-6">
    <form action="{% url 'dashboard:logout' %}" method="post">
      {% csrf_token %}
      <button type="submit" class="gl-secondary-btn w-full">Log out</button>
    </form>
  </div>
</aside>
<div class="fixed inset-0 z-30 bg-black/60 md:hidden" x-show="sidebarOpen" x-cloak x-transition.opacity @click="sidebarOpen = false"></div>
