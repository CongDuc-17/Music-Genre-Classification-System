{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<div class="max-w-xl">
  <section class="spotify-card">
    <h2 class="mb-2 text-2xl font-bold">Profile</h2>
    <p class="mb-6 text-sm text-spotify-muted">Update the account details shown in your workspace.</p>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {% for field in form %}
      <div>
        <label class="mb-2 block text-xs font-bold uppercase text-spotify-muted" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<p class="mt-2 text-xs text-red-400">{{ field.errors.0 }}</p>{% endif %}
      </div>
      {% endfor %}
      <button type="submit" class="spotify-pill-btn">Save changes</button>
    </form>
  </section>
</div>
{% endblock %}
